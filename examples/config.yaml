# loglantern example configuration. Secrets are never written here: every *_env names an
# environment variable (e.g. from a systemd EnvironmentFile); NAME_FILE=/path reads it from a file.
# Reload after changes: systemctl reload loglantern (SIGHUP).

listen:
  ingest: "0.0.0.0:8440"   # Fluent Bit; keep it on the private network
  api: "127.0.0.1:8441"    # dashboards; put a TLS reverse proxy in front

ingest:
  mask_emails: true

storage:
  path: /var/lib/loglantern/loglantern.db
  cache_mb: 32
  retention: {logs: 5d, metrics: 5d, counters: 90d, incidents: 90d}

# one ingest token per environment: the token decides the environment of every record
envs:
  uat:  {ingest_token_env: LOGLANTERN_TOKEN_UAT}
  prod: {ingest_token_env: LOGLANTERN_TOKEN_PROD}

# known hosts are reported as missing even if they never sent anything
hosts:
  - {env: prod, host: web-1, role: web}
  - {env: prod, host: db-1, role: db}
missing_after: 3m
tick: 15s
window: 2h

# series come from Fluent Bit metrics (cpu.*), the example checks in examples/checks (mem.*, disk.*,
# load.*, systemd.*, postgres.*, replication.*, backup.*), probes (probe.*) and Lightsail (lightsail.*)
rules:
  - {name: cpu-high, type: threshold, series: cpu.cpu_p, op: ">", value: "90", for: 10m}
  - {name: mem-high, type: threshold, series: mem.used_pct, op: ">=", value: "90", for: 5m}
  - {name: swap-high, type: threshold, series: mem.swap_pct, op: ">=", value: "50", for: 15m}
  - {name: disk-full, type: threshold, series: disk.used_pct, op: ">=", value: "85", severity: critical}
  - {name: units-failed, type: threshold, series: systemd.failed, op: ">", value: "0", for: 5m,
     text: "{host}: failed systemd units ({value})"}
  - {name: checks-stopped, type: absent, series: mem.used_pct, max_age: 15m}   # the check timer died
  - {name: backup-failed, type: text, series: backup.status, op: "!=", value: ok, severity: critical,
     match: {role: db}, text: "{rule} on {host}: {detail}"}
  - {name: backup-stale, type: threshold, series: backup.age_h, op: ">", value: "36", match: {role: db}}
  - {name: backup-missing, type: absent, series: backup.age_h, max_age: 2h, match: {role: db}}
  - {name: replication-lag, type: threshold, series: replication.lag_s, op: ">", value: "300", for: 5m}
  - {name: error-burst, type: lograte, level: err, count: 20, per: 5m}       # error and worse
  - {name: oom, type: lograte, pattern: "Out of memory|oom-kill", count: 1, per: 5m, severity: critical}
  - {name: traffic-anomaly, type: anomaly, series: app.requests_per_min, zscore: 4, min_samples: 30,
     min_delta: 50, severity: info}
  - {name: cpu-credits-low, type: threshold, series: lightsail.burst_pct, op: "<", value: "20", for: 30m}
  - {name: site-down, type: threshold, series: probe.website.up, op: "<", value: "1", for: 10m, severity: critical}
  - {name: cert-expiring, type: threshold, series: probe.website.cert_days, op: "<", value: "14"}

# notifiers: named outputs, each with exactly one type (telegram, slack, email, webhook)
notifiers:
  tg:                                   # a Telegram forum group: one topic per target
    telegram:
      token_env: LOGLANTERN_TELEGRAM_TOKEN
      chat_id: "-1001234567890"
      topics: {prod: 2, uat: 3, db: 4, ai: 5, reports: 6}
  team:                                 # Slack bot (chat:write); or {webhook_url_env: …} for one channel
    slack:
      token_env: LOGLANTERN_SLACK_TOKEN
      channel: C0000DEFAULT
      channels: {prod: C0000PROD}
  mail:                                 # any SMTP relay; port 587 STARTTLS by default
    email:
      host: smtp.example.org
      user_env: LOGLANTERN_SMTP_USER
      password_env: LOGLANTERN_SMTP_PASSWORD
      from: alerts@example.org
      to: [ops@example.org]
      targets: {mgmt: [cto@example.org]}
  pager:
    webhook: {url_env: LOGLANTERN_WEBHOOK_URL}

# routes: every route whose match fits gets the message; send lists "notifier" or "notifier/target"
routes:
  - {name: prod, match: {env: prod}, send: [tg/prod, team/prod], repeat: 4h}   # remind while open
  - {name: uat,  match: {env: uat},  send: [tg/uat]}
  - {name: db,   match: {role: db},  send: [tg/db]}
  - {name: pager, match: {env: prod, severity: [critical]}, send: [pager]}
  - name: mgmt
    match: {env: prod, severity: [critical]}
    send: [mail/mgmt]
    digest: 1h                          # one bundled mail per hour at most
    send_resolved: false
  - {name: ai,    send: [tg/ai]}
  - {name: daily, send: [tg/reports, mail]}

# optional AI agents: one call each, no tools; answers are sent as follow-up messages
# and never decide alarms. Without "agents" one default "explain" agent runs on every incident.
ai:
  key_env: OPENROUTER_API_KEY
  model: openai/gpt-4o-mini          # default model of all agents
  daily_calls: 50                    # budget shared by all agents
  agents:
    - name: explain
      on: incident_open
      match: {severity: [warning, critical]}
    - name: dba
      on: incident_open
      match: {role: db}
      model: anthropic/claude-haiku-4.5
      prompt_file: agents/dba.md     # relative to this file
      context: {logs: 40, level: notice, lookback: 1h}
      route: db
    - name: report-review
      on: daily_report
      prompt: |
        You read a daily monitoring report. Name at most 3 things worth acting on today,
        most important first, one line each. If nothing needs action, say so.

probes:
  - {name: website, env: prod, url: "https://www.example.org/health", contains: ok}

# optional: CPU burst capacity of Lightsail instances; off unless both variables are set
lightsail:
  regions: [eu-central-1]
  access_key_env: LOGLANTERN_AWS_ACCESS_KEY_ID
  secret_key_env: LOGLANTERN_AWS_SECRET_ACCESS_KEY
  interval: 15m
  instances:
    web-1-instance: {env: prod, host: web-1}
    db-1-instance: {env: prod, host: db-1}

report: {at: "07:00", tz: Europe/Berlin, route: daily}

# host table (state, CPU, memory, swap, disk) every 2 hours, on even UTC hours
status: {every: 2h, tz: Europe/Berlin, route: daily}

# maintenance windows mute notifications (incidents are still recorded and announced afterwards if
# still open); ad-hoc silences are created with POST /api/v1/silences (role admin)
maintenance:
  - {name: weekly-patching, days: [sun], from: "02:00", to: "04:00", tz: Europe/Berlin}
  - {name: db-migration, match: {role: db}, starts: 2026-11-01T20:00:00Z, ends: 2026-11-01T22:00:00Z}

auth:
  api_keys:
    - {name: status-board, key_env: LOGLANTERN_KEY_BOARD, role: viewer, envs: [prod]}
    - {name: ops-cli, key_env: LOGLANTERN_KEY_OPS, role: admin}     # may manage silences
  jwt:
    - name: admin-app
      public_key_file: /etc/loglantern/admin-app.pem
      roles:
        admin:  [{claim: permissions.admin, equals: true}]
        logs:   [{claim: permissions.developer, equals: true}]
        viewer: [{claim: permissions.staff, equals: true}]

cors: ["https://admin.example.org"]
