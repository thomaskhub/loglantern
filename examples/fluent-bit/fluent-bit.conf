# Fluent Bit on each host: journald logs, check facts and basic metrics to loglantern.
# Set LOGLANTERN_TOKEN (ingest token of this environment), LOGLANTERN_HOST and HOST_ROLE in the unit environment.

[SERVICE]
    flush                     5
    log_level                 warn
    # disk buffer: nothing is lost while loglantern is down or busy (it answers 503)
    storage.path              /var/lib/fluent-bit/buffer
    storage.sync              normal
    storage.backlog.mem_limit 8M

[INPUT]
    name              systemd
    tag               log.journal
    read_from_tail    on
    db                /var/lib/fluent-bit/systemd.db
    storage.type      filesystem
    # drop debug lines at the source (same-field matches are OR-ed)
    systemd_filter_type Or
    systemd_filter    PRIORITY=0
    systemd_filter    PRIORITY=1
    systemd_filter    PRIORITY=2
    systemd_filter    PRIORITY=3
    systemd_filter    PRIORITY=4
    systemd_filter    PRIORITY=5
    systemd_filter    PRIORITY=6

[INPUT]
    name          cpu
    tag           metric.cpu
    interval_sec  60

[INPUT]
    name          mem
    tag           metric.mem
    interval_sec  60

# only the totals, not one series per core
[FILTER]
    name           record_modifier
    match          metric.cpu
    allowlist_key  cpu_p
    allowlist_key  user_p
    allowlist_key  system_p

[FILTER]
    name   modify
    match  metric.*
    add    kind metric

[FILTER]
    name   modify
    match  metric.cpu
    add    source cpu

[FILTER]
    name   modify
    match  metric.mem
    add    source mem

[FILTER]
    name    record_modifier
    match   *
    record  host ${LOGLANTERN_HOST}
    record  role ${HOST_ROLE}

[OUTPUT]
    name              http
    match             *
    host              ${LOGLANTERN_ADDR}
    port              8440
    uri               /ingest
    format            json
    json_date_key     date
    json_date_format  double
    compress          gzip
    header            Authorization Bearer ${LOGLANTERN_TOKEN}
    retry_limit       no_limits
