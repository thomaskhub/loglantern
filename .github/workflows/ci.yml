name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable  # newest Go: binaries get the latest standard-library fixes
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: test (unit, pipeline, Fluent Bit container e2e via podman)
        run: go test -race -count=1 ./...
      - name: load test (1,000 records/s, < 100 MB RSS)
        run: LOGLANTERN_LOAD=30s go test -count=1 -run TestLoad -v ./test/
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
